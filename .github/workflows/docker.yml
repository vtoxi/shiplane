# Publishes the image to Docker Hub when a version tag (v1.2.3) is pushed.
# One-time setup in the GitHub repository: Settings, Secrets and variables, Actions:
#   secret  DOCKERHUB_USERNAME   your Docker Hub user name
#   secret  DOCKERHUB_TOKEN      a Docker Hub access token (Account settings, Security) with Read & Write
#   variable DOCKERHUB_IMAGE     for example  yourname/shiplane
name: docker
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
